<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">HolyAccel BNN accelerator architecture</title>
  <desc id="desc">A clean system diagram showing a PicoRV32 host, AXI-Lite control, SRAM-backed memory system, and eight parallel XNOR-popcount processing elements.</desc>
  <defs>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef826c"/><stop offset="0.50" stop-color="#b978c4"/><stop offset="1" stop-color="#59a9dc"/>
    </linearGradient>
    <linearGradient id="coreStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3a471"/><stop offset="1" stop-color="#67a8d3"/>
    </linearGradient>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d59d76"/></marker>
    <marker id="arrowCool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#70acd3"/></marker>
    <style>
      .title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 29px; font-weight: 600; letter-spacing: 1.6px; fill: #f4f5f6; }
      .meta { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 2px; fill: #949da6; }
      .section { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 2.2px; fill: #aeb6be; }
      .label { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #f0f2f4; }
      .body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #d3d7db; }
      .small { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: .55px; fill: #959fa9; }
      .micro { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .55px; fill: #929ca6; }
      .box { fill: #080a0c; stroke-width: 2; }
      .wireWarm { fill: none; stroke: #d59d76; stroke-width: 2; marker-end: url(#arrowWarm); }
      .wireCool { fill: none; stroke: #70acd3; stroke-width: 2; marker-end: url(#arrowCool); }
      .wirePlain { fill: none; stroke: #77818a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1125" fill="#050607"/>
  <text x="52" y="58" class="title">HOLYACCEL // BNN ACCELERATOR</text>
  <text x="1748" y="58" class="meta" text-anchor="end">SYSTEM ARCHITECTURE · SKY130</text>
  <rect x="44" y="92" width="1712" height="952" rx="7" fill="none" stroke="url(#chipStroke)" stroke-width="5"/>

  <!-- HOST SYSTEM -->
  <rect x="76" y="126" width="330" height="840" rx="4" fill="none" stroke="#d77f70" stroke-width="2"/>
  <text x="102" y="162" class="section">HOST SYSTEM</text>
  <rect x="102" y="194" width="278" height="114" rx="3" class="box" stroke="#dc8772"/>
  <text x="241" y="242" class="label" text-anchor="middle">PicoRV32 CPU</text>
  <text x="241" y="272" class="small" text-anchor="middle">FIRMWARE</text>
  <text x="241" y="292" class="small" text-anchor="middle">NETWORK DESCRIPTORS</text>
  <path d="M241 308 V348" class="wireWarm"/>
  <rect x="102" y="350" width="278" height="110" rx="3" class="box" stroke="#d98c74"/>
  <text x="241" y="397" class="body" text-anchor="middle">System Bus</text>
  <text x="241" y="425" class="body" text-anchor="middle">+ Address Decode</text>
  <text x="241" y="447" class="micro" text-anchor="middle">MEMORY-MAPPED INTERCONNECT</text>
  <path d="M241 460 V504 M148 504 H334" class="wirePlain"/>
  <path d="M148 504 V526 M241 504 V526 M334 504 V526" class="wirePlain"/>
  <rect x="102" y="528" width="88" height="132" rx="3" class="box" stroke="#ca8e79"/>
  <text x="146" y="582" class="body" text-anchor="middle">Program</text><text x="146" y="611" class="body" text-anchor="middle">RAM</text>
  <rect x="197" y="528" width="88" height="132" rx="3" class="box" stroke="#bf927e"/>
  <text x="241" y="582" class="body" text-anchor="middle">Input</text><text x="241" y="611" class="body" text-anchor="middle">BRAM</text>
  <rect x="292" y="528" width="88" height="132" rx="3" class="box" stroke="#b39785"/>
  <text x="336" y="574" class="body" text-anchor="middle">Threshold</text><text x="336" y="603" class="body" text-anchor="middle">BRAM</text>
  <text x="241" y="910" class="small" text-anchor="middle">PROGRAM + INPUT STORAGE</text>

  <!-- CONTROL -->
  <rect x="434" y="126" width="390" height="840" rx="4" fill="none" stroke="#b29a89" stroke-width="2"/>
  <text x="460" y="162" class="section">CONTROL</text>
  <path d="M380 405 H420 V242 H460" class="wireWarm"/>
  <rect x="462" y="194" width="334" height="96" rx="3" class="box" stroke="#ba9986"/>
  <text x="629" y="237" class="label" text-anchor="middle">AXI4-Lite Wrapper</text>
  <text x="629" y="266" class="small" text-anchor="middle">CONFIGURATION INTERFACE</text>
  <path d="M629 290 V326" class="wireWarm"/>
  <rect x="462" y="328" width="334" height="96" rx="3" class="box" stroke="#b29c8b"/>
  <text x="629" y="368" class="body" text-anchor="middle">Control + Status Registers</text>
  <text x="629" y="398" class="small" text-anchor="middle">CTRL · STATUS · NUM_LAYERS</text>
  <path d="M629 424 V458" class="wireWarm"/>
  <rect x="462" y="460" width="334" height="112" rx="3" class="box" stroke="#a9a091"/>
  <text x="629" y="500" class="body" text-anchor="middle">16-entry Layer Descriptor Table</text>
  <text x="629" y="530" class="small" text-anchor="middle">INPUT · WEIGHTS · THRESHOLDS</text>
  <text x="629" y="552" class="small" text-anchor="middle">DIMENSIONS · OUTPUT COUNT</text>
  <path d="M629 572 V612" class="wireWarm"/>
  <rect x="462" y="614" width="334" height="126" rx="3" class="box" stroke="#9fa496"/>
  <text x="629" y="661" class="label" text-anchor="middle">Layer Sequencer</text>
  <text x="629" y="692" class="body" text-anchor="middle">Autonomous execution</text>
  <text x="629" y="720" class="small" text-anchor="middle">CURRENT · FIRST · LAST · NEXT</text>
  <text x="629" y="892" class="small" text-anchor="middle">SOFTWARE CONFIGURES ONCE</text>
  <text x="629" y="916" class="small" text-anchor="middle">HARDWARE RUNS THE NETWORK</text>

  <!-- BNN CORE -->
  <rect x="852" y="126" width="872" height="840" rx="4" fill="none" stroke="url(#coreStroke)" stroke-width="2.5"/>
  <text x="878" y="162" class="section">BNN CORE</text>
  <path d="M796 677 H836 V235 H880" class="wireCool"/>
  <rect x="880" y="194" width="816" height="82" rx="3" class="box" stroke="#79a6bd"/>
  <text x="1288" y="228" class="label" text-anchor="middle">Controller FSM</text>
  <text x="1288" y="256" class="small" text-anchor="middle">FETCH · COMPUTE · WRITE · ADVANCE</text>
  <path d="M998 276 V328 M1288 276 V328 M1558 276 V328" class="wirePlain"/>
  <rect x="880" y="330" width="236" height="118" rx="3" class="box" stroke="#7da8b5"/>
  <text x="998" y="373" class="body" text-anchor="middle">Activation</text><text x="998" y="401" class="body" text-anchor="middle">Ping-Pong A / B</text>
  <text x="998" y="430" class="small" text-anchor="middle">BIT-PACKED 32-BIT WORDS</text>
  <rect x="1130" y="330" width="276" height="118" rx="3" class="box" stroke="#82a8aa"/>
  <text x="1268" y="372" class="body" text-anchor="middle">16 × 2 KiB SRAM</text><text x="1268" y="400" class="body" text-anchor="middle">Weight Banks</text>
  <text x="1268" y="430" class="small" text-anchor="middle">TWO BANKS PER PE</text>
  <rect x="1420" y="330" width="276" height="118" rx="3" class="box" stroke="#82a6a0"/>
  <text x="1558" y="373" class="body" text-anchor="middle">Threshold Buffer × 8</text><text x="1558" y="405" class="small" text-anchor="middle">SIGNED 12-BIT</text>
  <path d="M998 448 V500 M1268 448 V500 M1558 448 V500" class="wireCool"/>
  <rect x="880" y="502" width="816" height="184" rx="3" fill="#080a0c" stroke="#d0a078" stroke-width="2.5"/>
  <text x="908" y="535" class="section">8 PARALLEL PROCESSING ELEMENTS</text>
  <rect x="908" y="558" width="142" height="88" rx="2" class="box" stroke="#d79070"/><text x="979" y="610" class="body" text-anchor="middle">XNOR</text>
  <path d="M1050 602 H1080" class="wireWarm"/>
  <rect x="1082" y="558" width="164" height="88" rx="2" class="box" stroke="#d39a72"/><text x="1164" y="594" class="body" text-anchor="middle">Popcount</text><text x="1164" y="622" class="body" text-anchor="middle">Tree</text>
  <path d="M1246 602 H1276" class="wireWarm"/>
  <rect x="1278" y="558" width="174" height="88" rx="2" class="box" stroke="#cba078"/><text x="1365" y="610" class="body" text-anchor="middle">Accumulator</text>
  <path d="M1452 602 H1482" class="wireWarm"/>
  <rect x="1484" y="558" width="184" height="88" rx="2" class="box" stroke="#bca585"/><text x="1576" y="610" class="body" text-anchor="middle">Comparator</text>
  <path d="M1080 686 V738 M1496 686 V738" class="wireCool"/>
  <rect x="880" y="740" width="400" height="108" rx="3" class="box" stroke="#8ca5a2"/>
  <text x="1080" y="784" class="body" text-anchor="middle">Bit-Packed Output Writer</text><text x="1080" y="816" class="small" text-anchor="middle">NEXT-LAYER ACTIVATIONS</text>
  <rect x="1296" y="740" width="400" height="108" rx="3" class="box" stroke="#83a5ae"/>
  <text x="1496" y="784" class="body" text-anchor="middle">Score Registers × 10</text><text x="1496" y="816" class="small" text-anchor="middle">FINAL-LAYER ACCUMULATORS</text>
  <path d="M880 794 H860 V389 H880" class="wireCool"/>
  <text x="898" y="918" class="meta">ON-CHIP DATA REUSE</text>
  <text x="1155" y="918" class="meta">PIPELINED XNOR–POPCOUNT</text>
  <text x="1494" y="918" class="meta">8 PEs · 16 SRAM MACROS</text>

  <text x="52" y="1090" class="small">DESCRIPTOR-DRIVEN · SRAM-BACKED · PLACED AND ROUTED IN SKY130</text>
  <text x="1748" y="1090" class="small" text-anchor="end">Johan Anil · HolyAccel</text>
</svg>
